version: 2
updates:
  # No composer.lock is committed, so Dependabot only opens a PR when a new
  # release falls outside the composer.json constraint. "widen" extends the
  # constraint (e.g. "^0.9.0" -> "^0.9.0|^1.0") instead of raising the floor.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: widen
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    # Runtime dependencies (laravel/boost, laravel/mcp) stay ungrouped so each
    # new major arrives in its own PR with its own CI run.
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

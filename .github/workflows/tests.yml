name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # No composer.lock is committed, so a new laravel/boost or laravel/mcp
  # release inside the current constraints can break the package without any
  # commit here. The weekly run catches that.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: ['11.55.*', '12.*', '13.*']
        exclude:
          - php: 8.2
            laravel: '13.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Pin Laravel version
        # bash on every OS: PowerShell hands the "|" in the carbon constraint
        # to cmd.exe via composer.bat, which treats it as a pipe.
        shell: bash
        run: composer require "laravel/framework:${{ matrix.laravel }}" "nesbot/carbon:^2.72.2|^3.0" --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        env:
          # Laravel 11 is EOL and blocked by current Composer advisories. We
          # install its final stable line only to preserve legacy test coverage.
          COMPOSER_NO_SECURITY_BLOCKING: ${{ startsWith(matrix.laravel, '11.') && '1' || '' }}

      - name: Execute tests
        run: vendor/bin/pest --colors=always
